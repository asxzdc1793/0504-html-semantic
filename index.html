<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0504 課程作業 - HTML5 語意化標籤</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", sans-serif;
        line-height: 1.6;
        margin: 0;
        background: #f0f4f8;
        color: #2d3748;
      }

      header {
        background: #2c3e50;
        color: white;
        padding: 2.5rem 2rem;
        text-align: center;
      }

      header h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }

      header p {
        margin: 0;
        color: #a0aec0;
        font-size: 1rem;
      }

      main {
        max-width: 800px;
        margin: 3rem auto;
        padding: 0 1.5rem;
      }

      h2 {
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #718096;
        margin-bottom: 1rem;
      }

      .card-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .card {
        background: white;
        border-radius: 10px;
        padding: 1.5rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.2s, transform 0.2s;
      }

      .card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transform: translateY(-2px);
      }

      .card-info {
        flex: 1;
      }

      .card-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 0.25rem;
      }

      .card-desc {
        font-size: 0.9rem;
        color: #718096;
        margin: 0;
      }

      .badge {
        background: #ebf8ff;
        color: #2b6cb0;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        white-space: nowrap;
        margin-left: 1.5rem;
      }

      footer {
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>

    <header>
      <h1>0504 課程作業</h1>
      <p>HTML5 語意化標籤練習</p>
    </header>

    <main>
      <h2>作業檔案</h2>

      <div class="card-list">
        <a class="card" href="homework.html">
          <div class="card-info">
            <p class="card-title">練習 1：語意化標籤重構</p>
            <p class="card-desc">使用 header、nav、main、article、section、aside、footer、time 等語意化標籤建構技術部落格版面</p>
          </div>
          <span class="badge">homework.html</span>
        </a>
      </div>
    </main>

    <footer>
      <p>0504 &mdash; LeoChen</p>
    </footer>

  </body>
</html>
